name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Check preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-36" && test -d "$ANDROID_HOME/build-tools/36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/typepilot-gradle.log"
      - name: Report build failure
        if: failure()
        run: |
          details=$(tail -n 60 "$RUNNER_TEMP/typepilot-gradle.log" | tr '\n' ' ')
          details=${details//'%'/'%25'}
          details=${details//$'\r'/'%0D'}
          echo "::error::$details"
          echo '### Android APK build error details' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 "$RUNNER_TEMP/typepilot-gradle.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TypePilot-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
